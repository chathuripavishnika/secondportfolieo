<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="calculator">
    <input type="text" id="display" readonly>
    <input type="text" id="result" readonly> 
    <div class="buttons">
    <button style="color: azure; background-color: red;" onclick="clearDisplay()">C</button> 
     <button style="color: azure; background-color:darkgoldenrod;" onclick="deletelast()">DEL</button> 
    <button onclick="pressNumber('%')">%</button>
    <button style="color: black;background-color: gray;" onclick="pressNumber('/')">/</button> 
    

    
    <button onclick="pressNumber('7')">7</button>
    <button onclick="pressNumber('8')">8</button>
    <button onclick="pressNumber('9')">9</button>
    <button style="color: black; background-color: gray;" onclick="pressNumber('*')">*</button>
    
    
    
    
    <button onclick="pressNumber('4')">4</button>
    <button onclick="pressNumber('5')">5</button>
    <button onclick="pressNumber('6')">6</button>
    <button style="color: black; background-color: gray;" onclick="pressNumber('-')">-</button>
    

    
    <button onclick="pressNumber('1')">1</button>
    <button onclick="pressNumber('2')">2</button>
    <button onclick="pressNumber('3')">3</button>
    <button style="color: black; background-color: gray;" onclick="pressNumber('+')">+</button>
    

    
    <button onclick="pressNumber('0')">0</button>
    <button style="color: white; background-color: cornflowerblue;" onclick="pressNumber('.')">.</button>
    <button style="color: black; background-color:gray;" onclick="calculate()">=</button>
    </div>
    </div>
   

    
    <script src="cal.js"></script>

</body>
</html>
