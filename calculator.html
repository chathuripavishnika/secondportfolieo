
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="calc.css">
</head>

<body>

    <div class="calculator">

        <div class="display">
            <input type="text" id="display" readonly>
        </div>

        <div class="buttons">

            <button onclick="pressNumber('7')">7</button>
            <button onclick="pressNumber('8')">8</button>
            <button onclick="pressNumber('9')">9</button>
            <button onclick="pressNumber('+')">+</button>

            <button onclick="pressNumber('6')">4</button>
            <button onclick="pressNumber('5')">5</button>
            <button onclick="pressNumber('4')">6</button>
            <button onclick="pressNumber('-')">-</button>

            <button onclick="pressNumber('3')">1</button>
            <button onclick="pressNumber('2')">2</button>
            <button onclick="pressNumber('1')">3</button>
            <button onclick="pressNumber('*')">*</button>

            <button onclick="pressNumber('0')">0</button>
            <button onclick="pressNumber('.')">.</button>
            <button style="background-color: coral;" onclick="clearDisplay()">C</button>
            <button onclick="pressNumber('/')">/</button>

            <button onclick="calculate()">=</button>

        </div>

    </div>

    

</body>
</html>
